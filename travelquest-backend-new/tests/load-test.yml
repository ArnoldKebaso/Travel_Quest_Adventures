# 🚀 TravelQuest Load Testing Configuration
# Performance testing for academic excellence

config:
  target: 'http://localhost:3000'
  phases:
    # Warm-up phase
    - duration: 60
      arrivalRate: 5
      name: "Warm up"
    
    # Ramp up phase
    - duration: 120
      arrivalRate: 10
      rampTo: 50
      name: "Ramp up load"
    
    # Sustained load
    - duration: 300
      arrivalRate: 50
      name: "Sustained load"
    
    # Peak load testing
    - duration: 120
      arrivalRate: 50
      rampTo: 100
      name: "Peak load"
    
    # Cool down
    - duration: 60
      arrivalRate: 100
      rampTo: 5
      name: "Cool down"

  processor: "./tests/load-test-functions.js"
  
  # Performance thresholds for academic scoring
  ensure:
    maxErrorRate: 1 # Max 1% error rate
    maxResponseTime: 500 # Max 500ms response time
    minThroughput: 100 # Min 100 requests per second

scenarios:
  - name: "Get all destinations"
    weight: 40
    flow:
      - get:
          url: "/destinations"
          expect:
            - statusCode: 200
            - hasProperty: "data"
          capture:
            - json: "$.data[0].id"
              as: "destinationId"

  - name: "Get specific destination"
    weight: 30
    flow:
      - get:
          url: "/destinations/{{ destinationId }}"
          expect:
            - statusCode: 200
          beforeRequest: "setAuthHeaders"

  - name: "Create destination (authenticated)"
    weight: 20
    flow:
      - post:
          url: "/destinations"
          json:
            name: "Load Test Destination {{ $uuid() }}"
            description: "Created during load testing"
            price: 1500
            category: "adventure"
            region: "oceania"
            coordinates: { lat: -25.2744, lng: 153.1278 }
            images: ["https://example.com/image1.jpg"]
            amenities: ["wifi", "parking"]
            activities: ["snorkeling", "diving"]
          expect:
            - statusCode: 201
          beforeRequest: "setAuthHeaders"

  - name: "Search destinations"
    weight: 10
    flow:
      - get:
          url: "/destinations?category=adventure&priceMax=2000"
          expect:
            - statusCode: 200

# Custom functions for load testing
functions:
  setAuthHeaders: |
    function(requestParams, context, ee, next) {
      // Add authentication headers for protected endpoints
      requestParams.headers = requestParams.headers || {};
      requestParams.headers['Authorization'] = 'Bearer fake-token-for-load-testing';
      return next();
    }
