paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: 🔐 User login
      description: |
        Authenticate a user and receive a JWT token.
        
        **Security Features:**
        - Bcrypt password hashing
        - Rate limiting (5 attempts per minute)
        - JWT token with expiration
        - Secure cookie support
        - Account lockout protection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  minLength: 8
                  example: "SecurePassword123!"
                rememberMe:
                  type: boolean
                  description: "Extend token expiration"
                  default: false
            examples:
              user_login:
                summary: Standard user login
                value:
                  email: "user@example.com"
                  password: "SecurePassword123!"
                  rememberMe: false
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                            description: "JWT authentication token"
                            example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                          user:
                            $ref: '#/components/schemas/User'
                          expiresIn:
                            type: string
                            example: "24h"
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: "Invalid email or password"
                code: "INVALID_CREDENTIALS"
                timestamp: "2024-01-01T12:00:00Z"
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: "Too many login attempts. Please try again later."
                code: "RATE_LIMIT_EXCEEDED"
                timestamp: "2024-01-01T12:00:00Z"

  /auth/register:
    post:
      tags:
        - Authentication
      summary: 📝 User registration
      description: |
        Register a new user account.
        
        **Validation Features:**
        - Email format validation
        - Password strength requirements
        - Duplicate email detection
        - Email verification workflow
        - GDPR compliance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                  example: "newuser@example.com"
                password:
                  type: string
                  minLength: 8
                  pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[@$!%*?&])[A-Za-z\\d@$!%*?&]{8,}$"
                  description: "Must contain uppercase, lowercase, number, and special character"
                  example: "SecurePassword123!"
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: "John Doe"
                acceptTerms:
                  type: boolean
                  description: "Must accept terms and conditions"
                  example: true
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
                          emailVerificationSent:
                            type: boolean
                            example: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: 🔄 Refresh token
      description: |
        Refresh an expired JWT token.
        
        **Token Management:**
        - Sliding session support
        - Automatic token rotation
        - Revocation list checking
        - Security event logging
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                            example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                          expiresIn:
                            type: string
                            example: "24h"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: 🚪 User logout
      description: |
        Logout a user and invalidate their token.
        
        **Security Features:**
        - Token blacklisting
        - Session cleanup
        - Security event logging
        - Multi-device logout support
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                logoutAll:
                  type: boolean
                  description: "Logout from all devices"
                  default: false
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: 🔑 Forgot password
      description: |
        Request a password reset email.
        
        **Security Features:**
        - Rate limiting to prevent abuse
        - Secure token generation
        - Email delivery confirmation
        - Expiration handling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
      responses:
        '200':
          description: Password reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Email not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: 🔒 Reset password
      description: |
        Reset password using a valid reset token.
        
        **Security Features:**
        - Token validation
        - Password strength requirements
        - Single-use tokens
        - Secure password hashing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                  description: "Password reset token from email"
                  example: "abc123def456"
                newPassword:
                  type: string
                  minLength: 8
                  pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[@$!%*?&])[A-Za-z\\d@$!%*?&]{8,}$"
                  example: "NewSecurePassword123!"
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
