sonar.projectKey=travelquest-backend
sonar.organization=travelquest
sonar.projectName=TravelQuest Backend
sonar.projectVersion=1.0.0

# Source code settings
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# TypeScript/JavaScript specific settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=test-results.xml

# Exclude files
sonar.exclusions=**/*.test.ts,**/*.spec.ts,**/node_modules/**,**/coverage/**,**/.aws-sam/**

# Quality gate settings
sonar.qualitygate.wait=true

# Code coverage thresholds (academic excellence)
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/mocks/**
sonar.typescript.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/mocks/**
