AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  TravelQuest Backend - AWS Academy Compatible
  Lambda functions only (DynamoDB tables already exist).

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 30
    MemorySize: 512
    Architectures: [ x86_64 ]
    Environment:
      Variables:
        NODE_ENV: production
        DESTINATIONS_TABLE: travelquest-destinations
        TOURS_TABLE: travelquest-tours
        BLOGS_TABLE: travelquest-blogs
        COMMENTS_TABLE: travelquest-comments

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: Environment stage (dev, prod, etc.)

Resources:
  TravelQuestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        # SAM expects these as single-quoted strings inside a string
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # Lambda Functions (no table creation - tables already exist)
  GetAllDestinationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/destinationHandler.getAllDestinations
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Events:
        ApiGetAll:
          Type: Api
          Properties:
            RestApiId: !Ref TravelQuestApi
            Path: /destinations
            Method: get

  GetDestinationByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/destinationHandler.getDestinationById
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Events:
        ApiGetOne:
          Type: Api
          Properties:
            RestApiId: !Ref TravelQuestApi
            Path: /destinations/{id}
            Method: get

  # Tours Functions
  GetAllToursFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/tourHandler.getAllTours
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Events:
        ApiGetAll:
          Type: Api
          Properties:
            RestApiId: !Ref TravelQuestApi
            Path: /tours
            Method: get

  GetTourByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/tourHandler.getTourById
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Events:
        ApiGetOne:
          Type: Api
          Properties:
            RestApiId: !Ref TravelQuestApi
            Path: /tours/{id}
            Method: get

  # Blog Functions
  GetAllBlogsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/blogHandler.getAllBlogs
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Events:
        ApiGetAll:
          Type: Api
          Properties:
            RestApiId: !Ref TravelQuestApi
            Path: /blogs
            Method: get

  GetBlogByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/blogHandler.getBlogById
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Events:
        ApiGetOne:
          Type: Api
          Properties:
            RestApiId: !Ref TravelQuestApi
            Path: /blogs/{id}
            Method: get

Outputs:
  TravelQuestApiUrl:
    Description: "API Gateway invoke URL"
    Value: !Sub "https://${TravelQuestApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/"

  ExistingTablesInfo:
    Description: "DynamoDB Tables (already created manually)"
    Value: "travelquest-destinations, travelquest-tours, travelquest-blogs, travelquest-comments"


