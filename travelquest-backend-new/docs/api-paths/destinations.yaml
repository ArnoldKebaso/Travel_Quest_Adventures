paths:
  /destinations:
    get:
      tags:
        - Destinations
      summary: 🔍 Get all destinations
      description: |
        Retrieve a paginated list of travel destinations with optional filtering and sorting.
        
        **Academic Excellence Features:**
        - Advanced pagination with cursor-based navigation
        - Multiple filtering options (category, region, price range)
        - Flexible sorting capabilities
        - Performance optimized with GSI queries
        - Comprehensive search functionality
        
        **Query Performance:**
        - Cached responses for popular queries
        - Efficient DynamoDB GSI utilization
        - Response time: < 200ms (average)
      parameters:
        - $ref: '#/components/parameters/limitQuery'
        - $ref: '#/components/parameters/pageQuery'
        - $ref: '#/components/parameters/categoryQuery'
        - $ref: '#/components/parameters/regionQuery'
        - name: priceMin
          in: query
          description: Minimum price filter (USD)
          schema:
            type: number
            minimum: 0
          example: 500
        - name: priceMax
          in: query
          description: Maximum price filter (USD)
          schema:
            type: number
            minimum: 0
          example: 5000
        - name: rating
          in: query
          description: Minimum rating filter (1-5)
          schema:
            type: number
            minimum: 1
            maximum: 5
          example: 4.0
        - name: search
          in: query
          description: Search term for name/description
          schema:
            type: string
            minLength: 3
            maxLength: 100
          example: "reef"
        - name: sortBy
          in: query
          description: Sort field
          schema:
            type: string
            enum: [name, price, rating, createdAt]
            default: createdAt
        - name: sortOrder
          in: query
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: cursor
          in: query
          description: Pagination cursor for next page
          schema:
            type: string
          example: "eyJ0aW1lc3RhbXAiOjE2OTk5OTk5OTl9"
      responses:
        '200':
          description: Successfully retrieved destinations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Destination'
                      meta:
                        type: object
                        properties:
                          page: { type: integer, example: 1 }
                          limit: { type: integer, example: 20 }
                          total: { type: integer, example: 150 }
                          hasMore: { type: boolean, example: true }
                          nextCursor: { type: string, example: "eyJ0aW1lc3RhbXAiOjE2OTk5OTk5OTl9" }
                          filters: 
                            type: object
                            example: { category: "adventure", region: "oceania" }
              examples:
                successful_response:
                  summary: Successful destinations list
                  value:
                    success: true
                    message: "Destinations retrieved successfully"
                    data:
                      - id: "dest-123"
                        name: "Great Barrier Reef"
                        description: "World's largest coral reef system"
                        price: 2500
                        category: "adventure"
                        region: "oceania"
                        rating: 4.8
                        reviewCount: 1247
                    meta:
                      page: 1
                      limit: 20
                      total: 150
                      hasMore: true
                    timestamp: "2024-01-01T12:00:00Z"
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags:
        - Destinations
      summary: ➕ Create a new destination
      description: |
        Create a new travel destination. Requires admin authentication.
        
        **Academic Excellence Features:**
        - Comprehensive input validation with Zod schemas
        - XSS protection and input sanitization
        - Automatic image processing and optimization
        - SEO-friendly URL generation
        - Integration with content management workflow
        
        **Security Features:**
        - Role-based access control (admin only)
        - Input sanitization to prevent XSS
        - Image URL validation
        - Rate limiting protection
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, price, category, region]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: "Machu Picchu Adventure"
                description:
                  type: string
                  minLength: 10
                  maxLength: 2000
                  example: "Explore the ancient Incan citadel high in the Andes Mountains"
                price:
                  type: number
                  minimum: 0
                  maximum: 100000
                  example: 3500
                category:
                  type: string
                  enum: [adventure, cultural, luxury, nature, wellness, urban, historical]
                  example: "cultural"
                region:
                  type: string
                  enum: [asia, europe, north_america, south_america, africa, oceania, antarctica]
                  example: "south_america"
                country:
                  type: string
                  example: "Peru"
                city:
                  type: string
                  example: "Cusco"
                coordinates:
                  type: object
                  properties:
                    lat: { type: number, minimum: -90, maximum: 90 }
                    lng: { type: number, minimum: -180, maximum: 180 }
                  example: { lat: -13.1631, lng: -72.5450 }
                images:
                  type: array
                  items: { type: string, format: uri }
                  maxItems: 10
                  example: ["https://example.com/machu-picchu-1.jpg"]
                amenities:
                  type: array
                  items: { type: string }
                  example: ["guided_tours", "hiking_gear", "altitude_preparation"]
                activities:
                  type: array
                  items: { type: string }
                  example: ["hiking", "cultural_tours", "photography"]
                difficulty:
                  type: string
                  enum: [easy, moderate, challenging, extreme]
                  example: "challenging"
                duration:
                  type: string
                  example: "4-7 days"
                bestTimeToVisit:
                  type: string
                  example: "May-September"
                tags:
                  type: array
                  items: { type: string }
                  example: ["unesco_heritage", "ancient_ruins", "hiking"]
            examples:
              complete_destination:
                summary: Complete destination data
                value:
                  name: "Machu Picchu Adventure"
                  description: "Explore the ancient Incan citadel high in the Andes Mountains. This UNESCO World Heritage site offers breathtaking views and rich cultural history."
                  price: 3500
                  category: "cultural"
                  region: "south_america"
                  country: "Peru"
                  city: "Cusco"
                  coordinates: { lat: -13.1631, lng: -72.5450 }
                  images: ["https://example.com/machu-picchu-1.jpg"]
                  amenities: ["guided_tours", "hiking_gear", "altitude_preparation"]
                  activities: ["hiking", "cultural_tours", "photography"]
                  difficulty: "challenging"
                  duration: "4-7 days"
                  bestTimeToVisit: "May-September"
                  tags: ["unesco_heritage", "ancient_ruins", "hiking"]
      responses:
        '201':
          description: Destination created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Destination'
              examples:
                created_destination:
                  summary: Successfully created destination
                  value:
                    success: true
                    message: "Destination created successfully"
                    data:
                      id: "dest-456"
                      name: "Machu Picchu Adventure"
                      description: "Explore the ancient Incan citadel..."
                      price: 3500
                      category: "cultural"
                      region: "south_america"
                      createdAt: "2024-01-01T12:00:00Z"
                      updatedAt: "2024-01-01T12:00:00Z"
                    timestamp: "2024-01-01T12:00:00Z"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /destinations/{id}:
    get:
      tags:
        - Destinations
      summary: 🔍 Get destination by ID
      description: |
        Retrieve detailed information about a specific destination.
        
        **Performance Features:**
        - Cached responses for popular destinations
        - Optimized single-item DynamoDB queries
        - Response time: < 100ms (average)
        - CDN integration for images
      parameters:
        - name: id
          in: path
          required: true
          description: Unique destination identifier
          schema:
            type: string
          example: "dest-123"
      responses:
        '200':
          description: Destination found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Destination'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags:
        - Destinations
      summary: ✏️ Update destination
      description: |
        Update an existing destination. Requires admin authentication.
        
        **Business Logic:**
        - Validates all input fields
        - Maintains audit trail of changes
        - Triggers cache invalidation
        - Sends notifications to subscribers
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "dest-123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, minLength: 10, maxLength: 2000 }
                price: { type: number, minimum: 0, maximum: 100000 }
                category: 
                  type: string
                  enum: [adventure, cultural, luxury, nature, wellness, urban, historical]
                region:
                  type: string
                  enum: [asia, europe, north_america, south_america, africa, oceania, antarctica]
                country: { type: string }
                city: { type: string }
                coordinates:
                  type: object
                  properties:
                    lat: { type: number, minimum: -90, maximum: 90 }
                    lng: { type: number, minimum: -180, maximum: 180 }
                images: { type: array, items: { type: string, format: uri } }
                amenities: { type: array, items: { type: string } }
                activities: { type: array, items: { type: string } }
                difficulty: 
                  type: string
                  enum: [easy, moderate, challenging, extreme]
                duration: { type: string }
                bestTimeToVisit: { type: string }
                tags: { type: array, items: { type: string } }
      responses:
        '200':
          description: Destination updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Destination'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags:
        - Destinations
      summary: 🗑️ Delete destination
      description: |
        Permanently delete a destination. Requires admin authentication.
        
        **Safety Features:**
        - Soft delete with recovery option
        - Cascade delete for related comments
        - Audit logging for compliance
        - Backup before deletion
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "dest-123"
      responses:
        '200':
          description: Destination deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
