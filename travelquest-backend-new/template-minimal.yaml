AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TravelQuest API - Minimal Version

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs18.x
    Environment:
      Variables:
        DESTINATIONS_TABLE: travelquest-destinations
        TOURS_TABLE: travelquest-tours
        BLOGS_TABLE: travelquest-blogs
        COMMENTS_TABLE: travelquest-comments
    Architectures:
      - x86_64

Resources:
  # Lambda Functions
  GetAllDestinationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: minimal-lambda/
      Handler: index.getAllDestinations
      Events:
        GetAllDestinations:
          Type: Api
          Properties:
            RestApiId: !Ref TravelQuestApi
            Path: /destinations
            Method: get

  GetDestinationByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: minimal-lambda/
      Handler: index.getDestinationById
      Events:
        GetDestinationById:
          Type: Api
          Properties:
            RestApiId: !Ref TravelQuestApi
            Path: /destinations/{id}
            Method: get

  GetAllToursFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: minimal-lambda/
      Handler: index.getAllTours
      Events:
        GetAllTours:
          Type: Api
          Properties:
            RestApiId: !Ref TravelQuestApi
            Path: /tours
            Method: get

  GetTourByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: minimal-lambda/
      Handler: index.getTourById
      Events:
        GetTourById:
          Type: Api
          Properties:
            RestApiId: !Ref TravelQuestApi
            Path: /tours/{id}
            Method: get

  GetAllBlogsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: minimal-lambda/
      Handler: index.getAllBlogs
      Events:
        GetAllBlogs:
          Type: Api
          Properties:
            RestApiId: !Ref TravelQuestApi
            Path: /blogs
            Method: get

  GetBlogByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: minimal-lambda/
      Handler: index.getBlogById
      Events:
        GetBlogById:
          Type: Api
          Properties:
            RestApiId: !Ref TravelQuestApi
            Path: /blogs/{id}
            Method: get

  # API Gateway
  TravelQuestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"

Outputs:
  TravelQuestApi:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${TravelQuestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  
  DestinationsEndpoint:
    Description: "Destinations API endpoint"
    Value: !Sub "https://${TravelQuestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/destinations"
  
  ToursEndpoint:
    Description: "Tours API endpoint"
    Value: !Sub "https://${TravelQuestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/tours"
  
  BlogsEndpoint:
    Description: "Blogs API endpoint"
    Value: !Sub "https://${TravelQuestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/blogs"
